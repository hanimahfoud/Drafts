<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12263f"/>
      <stop offset="1" stop-color="#24384f"/>
    </linearGradient>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <g clip-path="url(#r)">
    <!-- circuit traces -->
    <g fill="none" stroke="#d9ac53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".34">
      <path d="M1 13h9l5-5"/>
      <path d="M63 21h-9l-5 5"/>
      <path d="M1 51h8l6 6"/>
      <path d="M63 45h-7l-6-6"/>
      <path d="M32 0v6"/>
      <path d="M32 64v-6"/>
      <path d="M0 32h5"/>
      <path d="M64 32h-5"/>
    </g>
    <!-- solder nodes -->
    <g fill="#d9ac53" opacity=".46">
      <circle cx="15" cy="8" r="2.1"/>
      <circle cx="49" cy="26" r="2.1"/>
      <circle cx="15" cy="57" r="2.1"/>
      <circle cx="50" cy="39" r="2.1"/>
    </g>
    <!-- binary motif -->
    <g fill="#ffffff" opacity=".13" font-family="monospace" font-size="7">
      <text x="4" y="27">01</text>
      <text x="50" y="58">10</text>
    </g>
  </g>

  <!-- initials -->
  <text x="32" y="42" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700"
        fill="#f2f5f9">JV</text>

  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#d9ac53" stroke-opacity=".32"/>
</svg>
